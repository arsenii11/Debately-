# Вариант с nginx на :80 (прод). Приложение слушает :3000 только внутри сети compose.
# Отдельно «только Next» без nginx: docker compose -f docker-compose.app-only.yml up -d
#
# Логи Next (не видны после `up -d`): docker compose logs -f app
# После правки .env пересоздай контейнер: docker compose up -d --force-recreate app
#
# HTTPS: см. DOCKER.md. Кратко: выпусти сертификат с профилем certbot, затем в .env задай
# NGINX_CONF=default-https.conf (и поправь домен в nginx/default-https.conf).
#
# Важно: GEMINI_* можно переопределять через .env, но безопаснее задавать тут литералами,
# а не через ${...}, чтобы избежать пустых подстановок.
services:
  app:
    build: .
    image: debately:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      GEMINI_USE_VERTEX: "true"
      GEMINI_VERTEX_PROJECT: REDACTED-PROJECT-ID
      GEMINI_VERTEX_LOCATION: us-central1
      MODELS: gemini-2.5-flash,gemini-1.5-flash
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vertex-sa.json
      GEMINI_SEARCH_TOOL: googleSearch
    volumes:
      - ./secrets/vertex-sa.json:/run/secrets/vertex-sa.json:ro
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - app

  # Запуск: docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: tester
    env_file:
      - .env
    environment:
      GEMINI_USE_VERTEX: "true"
      GEMINI_VERTEX_PROJECT: REDACTED-PROJECT-ID
      GEMINI_VERTEX_LOCATION: us-central1
      MODELS: gemini-2.5-flash,gemini-1.5-flash
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vertex-sa.json
      GEMINI_SEARCH_TOOL: googleSearch
    volumes:
      - ./secrets/vertex-sa.json:/run/secrets/vertex-sa.json:ro
    profiles:
      - test

  # Запуск только вручную: docker compose --profile certbot run --rm certbot certonly ...
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles:
      - certbot

volumes:
  certbot-www:
  certbot-etc:
